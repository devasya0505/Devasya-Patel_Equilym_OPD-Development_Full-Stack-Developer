# =============================================================
# OPD Mini Module — Application Configuration
# =============================================================

# ---- MySQL DataSource ----
# Connects to local XAMPP MariaDB; JPA auto-creates tables
spring.datasource.url=jdbc:mysql://localhost:3306/opd_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' means Hibernate will create/alter tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=8080

# ---- CORS (allow Angular dev server) ----
# We handle this in a WebConfig class for fine-grained control
