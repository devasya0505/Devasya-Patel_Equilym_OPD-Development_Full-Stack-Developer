<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16697A"/>
      <stop offset="100%" stop-color="#489FB5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16697A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Background Shield (Caribbean to Moonstone) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#medGrad)" filter="url(#glow)"/>
  
  <!-- Hospital Medical Cross (Isabelline Neutral) -->
  <rect x="26" y="14" width="12" height="36" rx="3" fill="#EDE7E3"/>
  <rect x="14" y="26" width="36" height="12" rx="3" fill="#EDE7E3"/>

  <!-- Pulse ECG Wave Overlay (Orange Peel High-Contrast) -->
  <path d="M12 32 L22 32 L26 20 L32 44 L38 24 L42 32 L52 32" 
        fill="none" 
        stroke="#FFA62B" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
